<!DOCTYPE html>
<!-- Gemini_scraping_code_generator v1.0.2 -->
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini スクレイピングコード・ジェネレーター</title>
    <style>
        /* === 色の定義（ライトテーマ） === */
        :root {
            --color-page-bg: #f4f6f9;
            --color-surface: #fff;
            --color-text: #333;
            --color-label: #555;
            --color-hint: #666;
            --color-accent: #174ea6;
            --color-button-bg: #174ea6;
            --color-button-bg-hover: #0f3d82;
            --color-button-text: #fff;
            --color-input-bg: #fff;
            /* UI部品（入力欄・チェックボックス・コード欄）の境界 */
            --color-control-border: #767676;
            /* 装飾的な区切り（hr・カードの枠） */
            --color-divider: #767676;
            --color-code-bg: #282c34;
            --color-code-text: #d4d4d4;
        }

        /* === 色の定義（ダークテーマ） === */
        @media (prefers-color-scheme: dark) {
            :root {
                --color-page-bg: #121212;
                --color-surface: #1e1e1e;
                --color-text: #e0e0e0;
                --color-label: #b0b0b0;
                --color-hint: #aaa;
                --color-accent: #8ab4f8;
                --color-button-bg: #8ab4f8;
                --color-button-bg-hover: #aecbfa;
                --color-button-text: #1e1e1e;
                --color-input-bg: #2d2d2d;
                --color-control-border: #888;
                --color-divider: #7a7a7a;
                --color-code-bg: #282c34;
                --color-code-text: #d4d4d4;
            }
        }

        body {
            font-family: sans-serif;
            line-height: 1.6;
            background-color: var(--color-page-bg);
            color: var(--color-text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--color-surface);
            border: 1px solid var(--color-divider);
            padding: 30px;
            border-radius: 8px;
        }
        h1 {
            font-size: 24px;
            color: var(--color-accent);
            border-bottom: 2px solid var(--color-accent);
            padding-bottom: 10px;
            margin-top: 0;
        }
        h2 {
            font-size: 20px;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--color-label);
        }
        input[type="text"], input[type="password"], input[type="number"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--color-control-border);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: sans-serif;
            font-size: 16px;
            background-color: var(--color-input-bg);
            color: var(--color-text);
        }
        .hint {
            color: var(--color-hint);
            margin: 0 0 8px;
        }
        input[type="checkbox"] {
            accent-color: var(--color-accent);
            outline: 1px solid var(--color-control-border);
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 0 20px;
        }
        .col {
            flex: 1;
            min-width: 240px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            font-size: 16px;
            margin-top: 8px;
            cursor: pointer;
            color: var(--color-text);
        }
        button {
            background-color: var(--color-button-bg);
            color: var(--color-button-text);
            border: none;
            font-family: sans-serif;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: var(--color-button-bg-hover);
        }
        #generate-btn {
            padding: 12px 24px;
            width: 100%;
        }
        #output-container {
            margin-top: 30px;
            display: none;
        }
        .output-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        #copy-btn {
            padding: 6px 12px;
        }
        #copy-status {
            margin: 0;
        }
        pre {
            background: var(--color-code-bg);
            color: var(--color-code-text);
            border: 1px solid var(--color-control-border);
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 16px;
            margin: 0;
        }
        .status {
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }
        .required {
            font-weight: normal;
        }
        hr {
            border: 0;
            border-top: 1px solid var(--color-divider);
            margin: 25px 0;
        }
    </style>
</head>
<body>

<main class="container">
    <h1>Gemini スクレイピングコード生成ツール</h1>
    
    <div class="form-group">
        <label for="api-key">Gemini API Key <span class="required">（必須）</span></label>
        <p id="api-key-hint" class="hint">AIzaSy... で始まるキーを入力</p>
        <input type="password" id="api-key" aria-describedby="api-key-hint" required>
        <label class="checkbox-label">
            <input type="checkbox" id="save-key"> このブラウザにキーを記憶させる
        </label>
    </div>

    <hr>

    <div class="form-group">
        <label for="target-url">1. 最初にアクセスするURL（ベースURL） <span class="required">（必須）</span></label>
        <p id="target-url-hint" class="hint">例：https://www.example.com/folder/... など</p>
        <input type="text" id="target-url" aria-describedby="target-url-hint" required>
    </div>

    <div class="row">
        <div class="col">
            <div class="form-group">
                <label for="page-rule">2. ページ移動のルール（クエリ等）</label>
                <p id="page-rule-hint" class="hint">例：?page={n} や /page/{n} など</p>
                <input type="text" id="page-rule" aria-describedby="page-rule-hint">
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label for="total-pages">3. 終了条件（最大ページ数）</label>
                <input type="number" id="total-pages" value="100" min="1">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="extract-rule">4. 各ページから抽出したい内容（ルール、タグ、日本語でOK） <span class="required">（必須）</span></label>
        <p id="extract-rule-hint" class="hint">例：すべてのtr要素を探し、その中にある最初のaタグのURLとテキストを抽出する。HTMLの出力形式は &lt;li&gt;&lt;a href='URL' target='_blank'&gt;テキスト&lt;/a&gt;&lt;/li&gt; にして、最後に全体を &lt;ul&gt; で括る。</p>
        <textarea id="extract-rule" aria-describedby="extract-rule-hint" required></textarea>
    </div>

    <button id="generate-btn" type="button">Pythonコードを自動生成する</button>
    <div id="status-text" class="status" role="status"></div>

    <div id="output-container">
        <div class="output-header">
            <h2>生成されたPythonコード（scraper.py）</h2>
            <button id="copy-btn" type="button">コードをコピー</button>
        </div>
        <p id="copy-status" role="status"></p>
        <pre><code id="code-block"></code></pre>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('api-key').value = savedKey;
            document.getElementById('save-key').checked = true;
        }
    });

    document.getElementById('generate-btn').addEventListener('click', async () => {
        const apiKey = document.getElementById('api-key').value.trim();
        const saveKey = document.getElementById('save-key').checked;
        const targetUrl = document.getElementById('target-url').value.trim();
        const pageRule = document.getElementById('page-rule').value.trim();
        const totalPages = document.getElementById('total-pages').value;
        const extractRule = document.getElementById('extract-rule').value.trim();

        const statusText = document.getElementById('status-text');
        const outputContainer = document.getElementById('output-container');
        const codeBlock = document.getElementById('code-block');

        if (!apiKey) {
            alert('APIキーを入力してください。');
            return;
        }
        if (!targetUrl || !extractRule) {
            alert('URLと抽出ルールは必須項目です。');
            return;
        }

        if (saveKey) {
            localStorage.setItem('gemini_api_key', apiKey);
        } else {
            localStorage.removeItem('gemini_api_key');
        }

        const prompt = `
以下の条件を満たす、スクレイピング用のPythonスクリプトを作成してください。
指示以外の余計な解説のテキストは省き、マークダウンのコードブロックの中にPythonコードのみを出力してください。

【スクレイピング条件】
- ターゲットURL(ベース): ${targetUrl}
- ページ送りのルール: ${pageRule} (※1ページ目はそのまま、2ページ目以降にこれが付与されるようなロジックにしてください)
- 最大ページ数(終了条件): ${totalPages}ページまでループ
- 抽出ルールと成果物のHTML構造:
${extractRule}

【成果物（index.html）のスタイル・アクセシビリティ要件】
最終的に出力されるHTMLファイル（index.html）は、以下のモダンなデザインとアクセシビリティ基準を必ず満たすように作成してください。

1. カラーモード対応
- ブラウザのシステム設定に連動するダークテーマ（@media (prefers-color-scheme: dark)）に対応させること。
- ライトテーマ表示・ダークテーマ表示の両方で、それぞれ必ずコントラスト比の確保を実施すること。（次項 2. に詳説）

2. コントラスト比の確保（アクセシビリティ向上）
- 【文字の視認性】すべてのテキストカラー（リンクテキスト、クリアボタン等を含む）は、それぞれ背景色に対して「4.5:1以上」のコントラスト比を確保すること。
- 【UIパーツの視認性】ディバイダー（hr）、テキスト入力欄（input）の枠線、ボタンの枠線等、すべてのUIパーツの境界線は、背景色に対して「3:1以上」のコントラスト比を確保すること。

3. フォントサイズ
- どのパーツにおいても16px以上のフォントサイズとすること。

4. レイアウト
- 検索窓のコンテナ（クリアボタン含む）は、画面上部に固定（position: sticky; top: 0;）され、スクロールしても常に最上部に表示され、背景が透けないようにすること。

5. HTMLの記述
- 文字コード宣言は小文字で <meta charset="utf-8"> と書くこと（大文字の UTF-8 は使わない）。
- 抽出したURLへのリンクには rel="noreferrer" のみを付けること。rel="noopener" は付けないこと（target="_blank" のリンクは現在のブラウザでは既定で noopener として動作するため）。

【コード作成上の注意点】
- サーバーに負荷をかけないよう、ループ内に time.sleep(1) などのウェイトを入れてください。
- User-Agent ヘッダーを設定してブロック対策をしてください。
- HTMLテンプレートへの値の埋め込みに str.format() や f-string を使わないでください（テンプレート内のCSS・JavaScriptの { } と衝突してエラーになるため）。{url_list_items} のようなプレースホルダーを str.replace() で置き換えてください。
- 最終的に、上記条件通りのHTMLファイルを出力するプログラムにしてください。
`;

        statusText.textContent = 'Geminiがコードを生成中...（数秒かかります）';
        outputContainer.style.display = 'none';
        document.getElementById('copy-status').textContent = '';

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error?.message || 'API通信エラーが発生しました。');
            }

            let generatedText = data.candidates[0].content.parts[0].text;
            generatedText = generatedText.replace(/^```python\s*/i, '').replace(/```\s*$/, '').trim();

            codeBlock.textContent = generatedText;
            statusText.textContent = '生成が完了しました！';
            outputContainer.style.display = 'block';

        } catch (error) {
            console.error(error);
            statusText.textContent = '';
            alert('エラーが発生しました:\n' + error.message);
        }
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
        const codeText = document.getElementById('code-block').textContent;
        const copyStatus = document.getElementById('copy-status');
        // 同じ文言が続いても読み上げられるよう、一度空にしてから設定する
        copyStatus.textContent = '';
        navigator.clipboard.writeText(codeText).then(() => {
            copyStatus.textContent = 'コードをコピーしました。';
        }).catch(() => {
            copyStatus.textContent = 'コードをコピーできませんでした。コード欄を選択してコピーしてください。';
        });
    });
</script>

</body>
</html>
